server.port=8080

# Local development defaults. Override with DB_URL, DB_USERNAME, DB_PASSWORD, and JWT_SECRET.
# hibernate.ddl-auto=update is for local development only. It is not a production migration strategy.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parkdeck?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

app.jwt.secret=${JWT_SECRET:local-dev-only-jwt-secret-change-me-32b}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.seed.enabled=${SEED_DEMO:true}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
